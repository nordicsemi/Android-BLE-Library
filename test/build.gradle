import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'no.nordicsemi.andorid.ble.test'
    compileSdkVersion 36

    defaultConfig {
        applicationId "no.nordicsemi.andorid.ble.test"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(path: ':ble-ktx')
    // Nordic theme
    implementation "no.nordicsemi.android.common:ui:2.5.2"
    implementation "no.nordicsemi.android.common:theme:2.5.2"
    implementation 'no.nordicsemi.android.common:permissions-ble:2.5.2'
    implementation 'no.nordicsemi.android.common:navigation:2.5.2'

    // Jetpack Compose bom
    implementation platform('androidx.compose:compose-bom:2025.09.00')

    // Text, Color, Surface
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    // Preview
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.ui:ui-tooling-preview"

    // Dagger and Hilt
    implementation 'com.google.dagger:hilt-android:2.57.1'
    kapt 'com.google.dagger:hilt-compiler:2.57.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    kapt 'androidx.hilt:hilt-compiler:1.3.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
}